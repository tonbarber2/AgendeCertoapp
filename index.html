
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Agende Certo AI</title>
    <meta name="description" content="O melhor aplicativo de agendamento online para barbearias e salões." />
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f5a623" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgendeCerto" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3655/3655598.png" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3655/3655598.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)', 
              'primary-hover': 'var(--color-primary-hover)',
              secondary: 'var(--color-secondary)',
              dark: '#050505', 
              'dark-card': '#0a0a0a',
              // Dynamic Text Colors
              'c-text-primary': 'var(--color-text-primary)',
              'c-text-secondary': 'var(--color-text-secondary)',
              // Dynamic List Colors
              'c-list-title': 'var(--color-list-title)',
              'c-list-price': 'var(--color-list-price)',
              'c-list-info': 'var(--color-list-info)',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Premium Gold Palette (Light Theme Defaults) */
        --color-primary: #D4AF37;
        --color-primary-hover: #e0941c;
        --color-secondary: #F3E5AB;
        
        --color-text-primary: #111827;
        --color-text-secondary: #6b7280;
        
        --color-list-title: #111827;
        --color-list-price: #D4AF37;
        --color-list-info: #6b7280;
      }
      .dark {
        /* Dark Theme Overrides */
        --color-primary-hover: #EACD65 !important;
        --color-text-primary: #f9fafb;
        --color-text-secondary: #d1d5db;
        --color-list-title: #ffffff;
        --color-list-info: #d1d5db;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9fafb;
        color: var(--color-text-secondary);
        transition: background-color 0.3s, color 0.3s;
        -webkit-tap-highlight-color: transparent;
      }
      .dark body {
        background-color: #050505;
        color: var(--color-text-secondary);
      }
      /* Custom Scrollbar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "firebase/": "https://esm.sh/firebase@^12.8.0/",

    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
